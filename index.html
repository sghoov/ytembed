<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube TV Animated Lower Third Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent; /* Fully transparent for PRISM overlay */
      font-family: 'YouTube Noto', 'Roboto', 'Segoe UI', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 50px;
    }

    /* Overall TV Navigation Bar */
    .yt-tv-player-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 90%;
      max-width: 1000px;
      background: rgba(15, 15, 15, 0.88);
      backdrop-filter: blur(12px);
      padding: 12px 24px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      transform: translateY(150px);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .yt-tv-player-bar.show {
      transform: translateY(0);
      opacity: 1;
    }

    .section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Base Button */
    .tv-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.1);
      color: #f1f1f1;
      border: 2px solid transparent;
      border-radius: 24px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease-in-out;
    }

    /* Channel Avatar Icon Styling */
    .channel-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .tv-btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      padding: 0;
    }

    .tv-btn svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    /* Enhanced Glow Remote Selection Effect */
    .tv-btn.focused {
      background: #ffffff !important;
      color: #0f0f0f !important;
      border-color: #ffffff;
