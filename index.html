<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube TV Animated Lower Third Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent; /* Fully transparent for PRISM overlay */
      font-family: 'YouTube Noto', 'Roboto', 'Segoe UI', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 50px;
    }

    /* Overall TV Navigation Bar */
    .yt-tv-player-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 90%;
      max-width: 1000px;
      background: rgba(15, 15, 15, 0.88);
      backdrop-filter: blur(12px);
      padding: 12px 24px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      transform: translateY(150px);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .yt-tv-player-bar.show {
      transform: translateY(0);
      opacity: 1;
    }

    .section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Base Button */
    .tv-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.1);
      color: #f1f1f1;
      border: 2px solid transparent;
      border-radius: 24px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease-in-out;
    }

    /* Channel Avatar Icon Styling */
    .channel-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .tv-btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      padding: 0;
    }

    .tv-btn svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    /* Enhanced Glow Remote Selection Effect */
    .tv-btn.focused {
      background: #ffffff !important;
      color: #0f0f0f !important;
      border-color: #ffffff;
      transform: scale(1.15);
      box-shadow: 0 0 25px 5px rgba(255, 255, 255, 0.9), 0 0 50px rgba(255, 255, 255, 0.5);
      z-index: 10;
    }

    .tv-btn.focused svg {
      fill: #0f0f0f !important;
    }

    /* Active / Clicked States */
    .tv-btn.liked {
      background: rgba(255, 255, 255, 0.3);
      color: #3ea6ff;
    }

    .tv-btn.liked svg {
      fill: #3ea6ff;
    }

    .tv-btn.subscribed {
      background: #cc0000;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="yt-tv-player-bar" id="tvBar">
    
    <div class="section">
      <img src="image.png" alt="Channel Badge" class="channel-avatar" id="avatarImg" onerror="this.src='https://via.placeholder.com/42/cc0000/ffffff?text=PG'">
      <div class="tv-btn">Papa Gigs</div>
      <div class="tv-btn" id="subBtn">
        <span id="subText">Subscribe</span>
      </div>
    </div>

    <div class="section">
      <div class="tv-btn tv-btn-icon">
        <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
      </div>
      <div class="tv-btn tv-btn-icon">
        <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </div>
      <div class="tv-btn tv-btn-icon">
        <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
      </div>
    </div>

    <div class="section">
      <div class="tv-btn tv-btn-icon" id="likeBtn">
        <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.58 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
      </div>
      
      <div class="tv-btn tv-btn-icon">
        <svg viewBox="0 0 24 24"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.36-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/></svg>
      </div>

      <div class="tv-btn tv-btn-icon">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
      </div>
    </div>

  </div>

  <script>
    let sequenceTimeouts = [];

    function runSequence() {
      const tvBar = document.getElementById('tvBar');
      const likeBtn = document.getElementById('likeBtn');
      const subBtn = document.getElementById('subBtn');
      const subText = document.getElementById('subText');

      // Reset UI elements
      tvBar.classList.remove('show');
      likeBtn.classList.remove('focused', 'liked');
      subBtn.classList.remove('focused', 'subscribed');
      subText.innerText = 'Subscribe';

      const schedule = (fn, delay) => {
        sequenceTimeouts.push(setTimeout(fn, delay));
      };

      // 1. Slide In
      schedule(() => tvBar.classList.add('show'), 200);

      // 2. High-glow focus on Like Button
      schedule(() => likeBtn.classList.add('focused'), 1000);

      // 3. Click Like Button
      schedule(() => {
        likeBtn.classList.remove('focused');
        likeBtn.classList.add('liked');
      }, 1800);

      // 4. Move Focus over to Subscribe Button
      schedule(() => subBtn.classList.add('focused'), 2600);

      // 5. Click Subscribe Button
      schedule(() => {
        subBtn.classList.remove('focused');
        subBtn.classList.add('subscribed');
        subText.innerText = 'Subscribed';
      }, 3400);

      // 6. Slide Out
      schedule(() => tvBar.classList.remove('show'), 5200);

      // 7. Pause off-screen, then loop automatically
      schedule(() => {
        runSequence();
      }, 6500);
    }

    // Auto-start loop on page load
    window.addEventListener('DOMContentLoaded', runSequence);
  </script>
</body>
</html>
