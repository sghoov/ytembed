<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube TV Remote Navigation Overlay - Papa Gigs</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      font-family: 'YouTube Noto', 'Roboto', 'Segoe UI', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 50px;
    }

    /* Overall TV Navigation Bar */
    .yt-tv-player-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 90%;
      max-width: 1000px;
      background: rgba(15, 15, 15, 0.92);
      backdrop-filter: blur(12px);
      padding: 12px 24px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      opacity: 1;
    }

    .section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Base Button */
    .tv-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.1);
      color: #f1f1f1;
      border: 2px solid transparent;
      border-radius: 24px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Channel Avatar Icon Styling */
    .channel-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .tv-btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      padding: 0;
    }

    .tv-btn svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
      transition: fill 0.2s ease;
    }

    /* Standard Selection Glow Effect */
    .tv-btn.focused {
      background: #ffffff !important;
      color: #0f0f0f !important;
      border-color: #ffffff;
      transform: scale(1.15);
      box-shadow: 0 0 25px 5px rgba(255, 255, 255, 0.9), 0 0 50px rgba(255, 255, 255, 0.5);
      z-index: 10;
    }

    .tv-btn.focused svg {
      fill: #0f0f0f !important;
    }

    /* MEGA FOCUS: 3x Scale Up for Like Button */
    #likeBtn.focused {
      transform: scale(3) !important; /* Scaled 3x larger */
      box-shadow: 0 0 45px 12px rgba(255, 255, 255, 1), 0 0 90px rgba(255, 255, 255, 0.8) !important;
      z-index: 50; /* Keeps it layered above everything else */
    }

    /* Click Pop Effect on 3x Base */
    @keyframes megaPop {
      0% { transform: scale(3); }
      50% { transform: scale(3.5); }
      100% { transform: scale(2.2); }
    }

    .tv-btn.popping {
      animation: megaPop 0.35s ease-out forwards;
    }

    /* Active / Clicked States */
    .tv-btn.liked {
      background: rgba(255, 255, 255, 0.3);
      color: #3ea6ff;
      transform: scale(2.2); /* Settles at 2.2x after click */
    }

    .tv-btn.liked svg {
      fill: #3ea6ff;
    }

    .tv-btn.subscribed {
      background: #cc0000;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="yt-tv-player-bar" id="tvBar">
    
    <div class="section">
      <img src="logo.jpg" alt="Papa Gigs Badge" class="channel-avatar" id="avatarImg" onerror="this.onerror=null; this.src='https://via.placeholder.com/42/cc0000/ffffff?text=PG';">
      <div class="tv-btn">Papa Gigs</div>
      <div class="tv-btn" id="subBtn">
        <span id="subText">Subscribe</span>
      </div>
    </div>

    <div class="section">
      <div class="tv-btn tv-btn-icon" id="rwBtn">
        <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
      </div>
      <div class="tv-btn tv-btn-icon" id="playBtn">
        <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </div>
      <div class="tv-btn tv-btn-icon" id="ffBtn">
        <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
      </div>
    </div>

    <div class="section">
      <div class="tv-btn tv-btn-icon" id="likeBtn">
        <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.58 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
      </div>
      
      <div class="tv-btn tv-btn-icon">
        <svg viewBox="0 0 24 24"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.36-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/></svg>
      </div>

      <div class="tv-btn tv-btn-icon">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
      </div>
    </div>

  </div>

 <script>
  let sequenceTimeouts = [];
  let isRunning = false;

  function clearFocus() {
    ['rwBtn', 'playBtn', 'ffBtn', 'likeBtn', 'subBtn'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.classList.remove('focused', 'popping');
    });
  }

  function runSequence() {
    if (isRunning) return; // Prevent double-triggering
    isRunning = true;

    const tvBar = document.getElementById('tvBar');
    const rwBtn = document.getElementById('rwBtn');
    const playBtn = document.getElementById('playBtn');
    const ffBtn = document.getElementById('ffBtn');
    const likeBtn = document.getElementById('likeBtn');
    const subBtn = document.getElementById('subBtn');
    const subText = document.getElementById('subText');

    // Reset initial state
    clearFocus();
    likeBtn.classList.remove('liked');
    subBtn.classList.remove('subscribed');
    subText.innerText = 'Subscribe';

    const schedule = (fn, delay) => {
      sequenceTimeouts.push(setTimeout(fn, delay));
    };

    // 1. Slide Bar In
    schedule(() => tvBar.classList.add('show'), 200);

    // 2. Playback Controls Navigation
    schedule(() => { clearFocus(); rwBtn.classList.add('focused'); }, 1000);
    schedule(() => { clearFocus(); playBtn.classList.add('focused'); }, 1400);
    schedule(() => { clearFocus(); ffBtn.classList.add('focused'); }, 1800);

    // 3. Roll over to "Like" (3x Scale Up)
    schedule(() => { clearFocus(); likeBtn.classList.add('focused'); }, 2300);

    // 4. Click "Like" (Pop up to 3.5x then settle)
    schedule(() => { 
      likeBtn.classList.add('popping');
      likeBtn.classList.add('liked'); 
    }, 2900);

    // 5. Scroll back left toward Subscribe
    schedule(() => { clearFocus(); ffBtn.classList.add('focused'); }, 3700);
    schedule(() => { clearFocus(); playBtn.classList.add('focused'); }, 4100);
    schedule(() => { clearFocus(); rwBtn.classList.add('focused'); }, 4500);

    // 6. Highlight and Click "Subscribe"
    schedule(() => { clearFocus(); subBtn.classList.add('focused'); }, 5100);
    schedule(() => {
      subBtn.classList.add('subscribed');
      subText.innerText = 'Subscribed';
    }, 5700);

    // 7. Clear focus outline
    schedule(() => clearFocus(), 6500);

    // 8. Slide Bar Back Off-Screen at ~9.5 Seconds
    schedule(() => {
      tvBar.classList.remove('show');
    }, 9500);

    // 9. Reset trigger state at 10 Seconds
    schedule(() => {
      isRunning = false;
    }, 10000);
  }
window.addEventListener('message', function(event) {
  if (event.data && event.data.event === 'trigger_tv_prompt') {
    runSequence();
  }
});
  // Listen for StreamElements Realtime Trigger
  window.addEventListener('onWidgetCustom', function (obj) {
    if (obj.detail && obj.detail.event === 'trigger_tv_prompt') {
      runSequence();
    }
  });
</script>
</body>
</html>
