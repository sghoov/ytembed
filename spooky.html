<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spooky Stream Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: transparent;
      font-family: 'Courier New', Courier, monospace;
    }

    #overlay-container {
      position: relative;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Full-Screen WebM Background Video Layer */
    #bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      z-index: 0;
    }

    /* Vector Cobweb (Top Left Corner) */
    .cobweb {
      position: absolute;
      top: 0;
      left: 0;
      width: 320px;
      height: 320px;
      opacity: 0.85;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.9));
      z-index: 5;
    }

    /* Canvas Layer for Fog, Bats, Spider & Screaming Apparition */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div id="overlay-container">
    <!-- WebM Alpha Video Layer in Background -->
    <video 
      id="bg-video" 
      src="https://www.dropbox.com/scl/fi/8bic4d2dliz7eeiq3gkdo/0825.webm?rlkey=a3jexovspw5ierfskwjxukmly&st=2kouadgh&raw=1" 
      autoplay 
      loop 
      muted 
      playsinline>
    </video>

    <canvas id="overlayCanvas"></canvas>

    <!-- Vector Cobweb -->
    <svg class="cobweb" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M 0,0 L 200,0 M 0,0 L 180,60 M 0,0 L 140,140 M 0,0 L 60,180 M 0,0 L 0,200" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" fill="none"/>
      <path d="M 40,0 Q 35,20 0,40 M 80,0 Q 70,45 0,80 M 120,0 Q 100,70 0,120 M 160,0 Q 130,100 0,160 M 200,0 Q 150,150 0,200" stroke="rgba(255,255,255,0.25)" stroke-width="1" fill="none"/>

    </svg>
  </div>

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

    resize();

        vy: (Math.random() - 0.5) * 0.2,
        radius: 200 + Math.random() * 250,
        opacity: 0.08 + Math.random() * 0.07
      });
    }
