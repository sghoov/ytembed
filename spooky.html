<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spooky Stream Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: transparent;
      font-family: 'Courier New', Courier, monospace;
    }

    #overlay-container {
      position: relative;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Top Tote Metrics Header */
    .header-metrics {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 35px;
      color: rgba(230, 230, 230, 0.7);
      font-size: 16px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
      font-weight: bold;
      z-index: 10;
    }

    /* Vector Web (Top Left Corner) */
    .cobweb {
      position: absolute;
      top: 0;
      left: 0;
      width: 320px;
      height: 320px;
      opacity: 0.85;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.9));
      z-index: 5;
    }

    /* Canvas Layer for Fog, Bats & Screaming Apparition */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div id="overlay-container">
    <canvas id="overlayCanvas"></canvas>

    <!-- Vector Cobweb & Swaying Spider -->
    <svg class="cobweb" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M 0,0 L 200,0 M 0,0 L 180,60 M 0,0 L 140,140 M 0,0 L 60,180 M 0,0 L 0,200" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" fill="none"/>
      <path d="M 40,0 Q 35,20 0,40 M 80,0 Q 70,45 0,80 M 120,0 Q 100,70 0,120 M 160,0 Q 130,100 0,160 M 200,0 Q 150,150 0,200" stroke="rgba(255,255,255,0.22)" stroke-width="1" fill="none"/>
      <path d="M 30,10 Q 25,25 10,30 M 60,20 Q 50,50 20,60 M 90,30 Q 75,75 30,90 M 120,40 Q 100,100 40,120" stroke="rgba(255,255,255,0.15)" stroke-width="0.8" fill="none"/>
      <line x1="100" y1="50" x2="100" y2="120" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
      <g transform="translate(96, 120)">
        <ellipse cx="4" cy="5" rx="3" ry="4" fill="rgba(220,220,220,0.6)"/>
        <circle cx="4" cy="2" r="2" fill="rgba(220,220,220,0.6)"/>
        <path d="M 1,2 Q -3,0 -2,5 M 7,2 Q 11,0 10,5 M 1,5 Q -4,5 -3,9 M 7,5 Q 12,5 11,9" stroke="rgba(220,220,220,0.6)" stroke-width="0.8" fill="none"/>
      </g>
    </svg>

    <!-- Shift Metrics Header -->
    <div class="header-metrics">
      <span class="metric">HAUNTED EARNINGS: <span id="earnings-display">\$142.50</span></span>
      <span class="metric">GHOSTLY MILES: <span id="miles-display">68.4</span></span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('overlayCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 1. Moving Volumetric Fog Particles
    const fogParticles = [];
    for (let i = 0; i < 16; i++) {
      fogParticles.push({
        x: Math.random() * canvas.width,
        y: canvas.height - (Math.random() * 380),
        vx: (Math.random() - 0.5) * 0.35,
        vy: (Math.random() - 0.5) * 0.18,
        radius: 180 + Math.random() * 220,
        opacity: 0.02 + Math.random() * 0.03
      });
    }

    // 2. Disturbing Apparition State Engine
    const ghost = {
      x: canvas.width * 0.75,
      y: canvas.height * 0.5,
      targetX: canvas.width * 0.75,
      targetY: canvas.height * 0.5,
      opacity: 0,
      targetOpacity: 0,
      scale: 1.0,
      state: 'dormant',
      jawOpen: 0,
      targetJawOpen: 0,
      eyeWidth: 1.0
    };

    function scheduleSpook() {
      const delay = ghost.state === 'dormant' 
        ? (25000 + Math.random() * 35000) // Appears randomly every 25-60 seconds
        : (9000 + Math.random() * 12000);  // Stays visible for 9-12 seconds

      setTimeout(() => {
        if (ghost.state === 'dormant') {
          ghost.targetX = canvas.width * (0.55 + Math.random() * 0.30);
          ghost.targetY = canvas.height * (0.35 + Math.random() * 0.30);
          ghost.targetOpacity = 0.45 + Math.random() * 0.20;
          ghost.targetJawOpen = Math.random() > 0.3 ? 0.85 : 0.25; // Randomly scream or hollow face
          ghost.state = 'fadingIn';
        } else if (ghost.state === 'active') {
          ghost.targetOpacity = 0;
          ghost.state = 'fadingOut';
        }
        scheduleSpook();
      }, delay);
    }
    scheduleSpook();

    // 3. Bat Swarm
    const bats = [];
    function spawnBat() {
      if (bats.length < 5 && Math.random() < 0.04) {
        bats.push({
          x: -40,
          y: Math.random() * (canvas.height * 0.65),
          vx: 3 + Math.random() * 3.5,
          vy: (Math.random() - 0.5) * 1.5,
          wingPhase: Math.random() * Math.PI * 2,
          size: 16 + Math.random() * 14
        });
      }
    }

    // Render Helpers
    function drawFogParticle(p) {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < -p.radius) p.x = canvas.width + p.radius;
      if (p.x > canvas.width + p.radius) p.x = -p.radius;

      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
      grad.addColorStop(0, `rgba(200, 210, 225, ${p.opacity})`);
      grad.addColorStop(0.6, `rgba(140, 155, 170, ${p.opacity * 0.3})`);
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawApparition(time) {
      if (ghost.opacity <= 0.005) return;

      ghost.x += (ghost.targetX - ghost.x) * 0.008;
      ghost.y += (ghost.targetY - ghost.y) * 0.008;
      ghost.opacity += (ghost.targetOpacity - ghost.opacity) * 0.015;
      ghost.jawOpen += (ghost.targetJawOpen - ghost.jawOpen) * 0.04;

      if (ghost.state === 'fadingIn' && Math.abs(ghost.opacity - ghost.targetOpacity) < 0.05) {
        ghost.state = 'active';
      }
      if (ghost.state === 'fadingOut' && ghost.opacity < 0.01) {
        ghost.state = 'dormant';
      }

      ctx.save();
      ctx.translate(ghost.x, ghost.y);

      // Pale Smoky Mask / Face Shroud
      const radius = 200;
      const faceGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, radius);
      const baseAlpha = ghost.opacity;
      
      faceGrad.addColorStop(0, `rgba(225, 230, 235, ${baseAlpha * 0.70})`);
      faceGrad.addColorStop(0.35, `rgba(160, 170, 185, ${baseAlpha * 0.35})`);
      faceGrad.addColorStop(0.7, `rgba(80, 90, 105, ${baseAlpha * 0.10})`);
      faceGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = faceGrad;
      ctx.beginPath();
      for (let angle = 0; angle < Math.PI * 2; angle += 0.12) {
        const distortion = Math.sin(angle * 4 + time * 0.002) * 14;
        const r = radius + distortion;
        const lx = Math.cos(angle) * r;
        const ly = Math.sin(angle) * r;
        if (angle === 0) ctx.moveTo(lx, ly);
        else ctx.lineTo(lx, ly);
      }
      ctx.closePath();
      ctx.fill();

      // Sunken Dark Feature Voids (Eyes & Screaming Mouth)
      ctx.fillStyle = `rgba(8, 10, 14, ${baseAlpha * 0.95})`;

      const eyeOffset = 48;
      const eyeSizeY = 32;
      const eyeSizeX = 23;

      // Left Eye Void
      ctx.beginPath();
      ctx.ellipse(-eyeOffset, -25, eyeSizeX, eyeSizeY, 0.1, 0, Math.PI * 2);
      ctx.fill();

      // Right Eye Void
      ctx.beginPath();
      ctx.ellipse(eyeOffset, -25, eyeSizeX, eyeSizeY, -0.1, 0, Math.PI * 2);
      ctx.fill();

      // Elongated Screaming Mouth Void
      const mouthY = 52 + (ghost.jawOpen * 16);
      const mouthWidth = 32;
      const mouthHeight = 52 + (ghost.jawOpen * 48);

      ctx.beginPath();
      ctx.ellipse(0, mouthY, mouthWidth, mouthHeight, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function animateBats() {
      spawnBat();
      for (let i = bats.length - 1; i >= 0; i--) {
        const b = bats[i];
        b.x += b.vx;
        b.y += b.vy + Math.sin(b.wingPhase) * 1.5;
        b.wingPhase += 0.3;

        if (b.x > canvas.width + 50) {
          bats.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.fillStyle = 'rgba(18, 20, 24, 0.75)';
        ctx.translate(b.x, b.y);
        
        const flap = Math.sin(b.wingPhase) * b.size * 0.4;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-b.size*0.5, -b.size*0.3 + flap, -b.size, -flap);
        ctx.quadraticCurveTo(-b.size*0.4, b.size*0.1, 0, b.size*0.1);
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(b.size*0.5, -b.size*0.3 + flap, b.size, -flap);
        ctx.quadraticCurveTo(b.size*0.4, b.size*0.1, 0, b.size*0.1);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    function loop(time) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < fogParticles.length; i++) {
        drawFogParticle(fogParticles[i]);
      }

      animateBats();
      drawApparition(time);

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
