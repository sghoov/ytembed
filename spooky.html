<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papa Gigs Halloween Shift Tote Board</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Main Container Frame */
    .tote-board-wrapper {
      position: relative;
      width: 1000px;
      height: 650px;
      background: url('https://i.imgur.com/image_1.png') no-repeat center center;
      background-size: contain;
      border-radius: 8px;
    }

    /* Transparent WebM Video Layer */
    .spooky-webm-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none; /* Allows click-throughs in OBS preview */
      z-index: 10;          /* Renders on top of the background layout */
    }

    /* Content Area Layered Below WebM */
    .tote-board-content {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="tote-board-wrapper">
    
    <!-- Transparent WebM Asset Overlay -->
    <video 
      class="spooky-webm-overlay" 
      src="https://www.dropbox.com/scl/fi/8bic4d2dliz7eeiq3gkdo/0825.webm?rlkey=a3jexovspw5ierfskwjxukmly&st=2kouadgh&raw=1" 
      autoplay 
      loop 
      muted 
      playsinline>
    </video>

    <!-- Board Data Container -->
    <div class="tote-board-content">
      <!-- Your live JSON fetch scripts and layout elements go here -->
    </div>

  </div>

</body>
</html>
