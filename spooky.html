<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spooky Stream Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: transparent;
      font-family: 'Courier New', Courier, monospace;
    }

    /* Fullscreen WebM Background Video Layer */
    .bg-video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 2s ease-in-out;
    }

    .bg-video.active {
      opacity: 1;
    }

    #overlay-container {
      position: relative;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Top Tote Metrics Header */
    .header-metrics {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 35px;
      color: rgba(240, 240, 240, 0.8);
      font-size: 16px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
      font-weight: bold;
      z-index: 10;
    }

    /* Vector Cobweb (Top Left Corner) */
    .cobweb {
      position: absolute;
      top: 0;
      left: 0;
      width: 320px;
      height: 320px;
      opacity: 0.85;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.9));
      z-index: 5;
    }

    /* Canvas Layer for Overlay */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Fullscreen WebM Background Videos -->
  <div class="bg-video-container">
    <video id="video1" class="bg-video active" autoplay loop muted playsinline>
      <source src="https://www.dropbox.com/scl/fi/3324g7gq4w6gahp1epwff/ghostface.webm?rlkey=ulv0oj20lz88y159ajsdugqyw&st=lkhxxm9x&raw=1" type="video/webm">
    </video>
    <video id="video2" class="bg-video" autoplay loop muted playsinline>
      <source src="https://www.dropbox.com/scl/fi/f6y8ghlfl00jyx1ye0040/witchface.webm?rlkey=3y2ffrt15vghe6p455pfuryll&st=x9zev3fx&raw=1" type="video/webm">
    </video>
  </div>

  <div id="overlay-container">
    <canvas id="overlayCanvas"></canvas>

    <!-- Vector Cobweb -->
    <svg class="cobweb" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M 0,0 L 200,0 M 0,0 L 180,60 M 0,0 L 140,140 M 0,0 L 60,180 M 0,0 L 0,200" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" fill="none"/>
      <path d="M 40,0 Q 35,20 0,40 M 80,0 Q 70,45 0,80 M 120,0 Q 100,70 0,120 M 160,0 Q 130,100 0,160 M 200,0 Q 150,150 0,200" stroke="rgba(255,255,255,0.25)" stroke-width="1" fill="none"/>
      <path d="M 30,10 Q 25,25 10,30 M 60,20 Q 50,50 20,60 M 90,30 Q 75,75 30,90 M 120,40 Q 100,100 40,120" stroke="rgba(255,255,255,0.18)" stroke-width="0.8" fill="none"/>
    </svg>

    <!-- Shift Metrics Header (Earnings removed) -->
    <div class="header-metrics">
      <span class="metric">GHOSTLY MILES: <span id="miles-display">68.4</span></span>
    </div>
  </div>

  <script>
    // Video Cross-Fade Controller
    const v1 = document.getElementById('video1');
    const v2 = document.getElementById('video2');
    let showingVideo1 = true;

    // Cycle between ghostface and witchface every 12 seconds
    setInterval(() => {
      if (showingVideo1) {
        v1.classList.remove('active');
        v2.classList.add('active');
      } else {
        v2.classList.remove('active');
        v1.classList.add('active');
      }
      showingVideo1 = !showingVideo1;
    }, 12000);

    const canvas = document.getElementById('overlayCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 1. Moving Volumetric Fog Particles
    const fogParticles = [];
    for (let i = 0; i < 20; i++) {
      fogParticles.push({
        x: Math.random() * canvas.width,
        y: canvas.height - (Math.random() * 450),
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.2,
        radius: 200 + Math.random() * 250,
        opacity: 0.08 + Math.random() * 0.07
      });
    }

    // 2. Screaming Main Ghost Apparition
    const ghost = {
      x: canvas.width * 0.75,
      y: canvas.height * 0.45,
      targetX: canvas.width * 0.75,
      targetY: canvas.height * 0.45,
      opacity: 0,
      targetOpacity: 0,
      scale: 1.0,
      state: 'dormant',
      jawOpen: 0,
      targetJawOpen: 0,
      hasSpawnedOnce: false
    };

    function scheduleSpook() {
      const delay = ghost.state === 'dormant' 
        ? (ghost.opacity === 0 && !ghost.hasSpawnedOnce ? 4000 : (15000 + Math.random() * 20000))
        : (10000 + Math.random() * 8000);

      setTimeout(() => {
        ghost.hasSpawnedOnce = true;
        if (ghost.state === 'dormant') {
          ghost.targetX = canvas.width * (0.50 + Math.random() * 0.35);
          ghost.targetY = canvas.height * (0.30 + Math.random() * 0.35);
          ghost.targetOpacity = 0.65 + Math.random() * 0.25;
          ghost.targetJawOpen = Math.random() > 0.3 ? 0.9 : 0.3;
          ghost.state = 'fadingIn';
        } else if (ghost.state === 'active') {
          ghost.targetOpacity = 0;
          ghost.state = 'fadingOut';
        }
        scheduleSpook();
      }, delay);
    }
    scheduleSpook();

    // 3. Subtle Floating Background Mini-Apparitions
    const miniGhosts = [];
    function spawnMiniGhost() {
      if (miniGhosts.length < 3 && Math.random() < 0.03) {
        miniGhosts.push({
          x: Math.random() * canvas.width,
          y: 100 + Math.random() * (canvas.height - 250),
          vx: (Math.random() - 0.5) * 0.6,
          vy: -0.2 - Math.random() * 0.4,
          opacity: 0,
          maxOpacity: 0.15 + Math.random() * 0.2,
          radius: 35 + Math.random() * 25,
          life: 0,
          maxLife: 250 + Math.random() * 200
        });
      }
    }

    function drawMiniGhosts() {
      spawnMiniGhost();
      for (let i = miniGhosts.length - 1; i >= 0; i--) {
        const mg = miniGhosts[i];
        mg.life++;
        mg.x += mg.vx + Math.sin(mg.life * 0.03) * 0.5;
        mg.y += mg.vy;

        // Fade in/out cycle
        if (mg.life < 50) {
          mg.opacity = (mg.life / 50) * mg.maxOpacity;
        } else if (mg.life > mg.maxLife - 50) {
          mg.opacity = ((mg.maxLife - mg.life) / 50) * mg.maxOpacity;
        }

        if (mg.life >= mg.maxLife) {
          miniGhosts.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.translate(mg.x, mg.y);

        // Soft wispy sphere
        const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, mg.radius);
        grad.addColorStop(0, `rgba(220, 230, 240, ${mg.opacity})`);
        grad.addColorStop(0.5, `rgba(160, 180, 200, ${mg.opacity * 0.5})`);
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, mg.radius, 0, Math.PI * 2);
        ctx.fill();

        // Dark hollow eyes
        ctx.fillStyle = `rgba(10, 12, 16, ${mg.opacity * 0.9})`;
        ctx.beginPath();
        ctx.ellipse(-mg.radius * 0.25, -mg.radius * 0.1, mg.radius * 0.12, mg.radius * 0.18, 0, 0, Math.PI * 2);
        ctx.ellipse(mg.radius * 0.25, -mg.radius * 0.1, mg.radius * 0.12, mg.radius * 0.18, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    // 4. Bat Swarm
    const bats = [];
    function spawnBat() {
      if (bats.length < 5 && Math.random() < 0.05) {
        bats.push({
          x: -40,
          y: Math.random() * (canvas.height * 0.65),
          vx: 3.5 + Math.random() * 3.5,
          vy: (Math.random() - 0.5) * 1.8,
          wingPhase: Math.random() * Math.PI * 2,
          size: 16 + Math.random() * 14
        });
      }
    }

    function animateBats() {
      spawnBat();
      for (let i = bats.length - 1; i >= 0; i--) {
        const b = bats[i];
        b.x += b.vx;
        b.y += b.vy + Math.sin(b.wingPhase) * 1.5;
        b.wingPhase += 0.3;

        if (b.x > canvas.width + 50) {
          bats.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.fillStyle = 'rgba(18, 20, 24, 0.85)';
        ctx.translate(b.x, b.y);
        
        const flap = Math.sin(b.wingPhase) * b.size * 0.4;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-b.size*0.5, -b.size*0.3 + flap, -b.size, -flap);
        ctx.quadraticCurveTo(-b.size*0.4, b.size*0.1, 0, b.size*0.1);
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(b.size*0.5, -b.size*0.3 + flap, b.size, -flap);
        ctx.quadraticCurveTo(b.size*0.4, b.size*0.1, 0, b.size*0.1);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    // 5. Crawling & Swaying Spider
    const spider = {
      x: 140,
      y: 40,
      targetY: 180,
      state: 'descending',
      waitTimer: 0,
      legPhase: 0
    };

    function updateSpider() {
      spider.legPhase += 0.15;

      if (spider.state === 'descending') {
        spider.y += 0.6;
        if (spider.y >= spider.targetY) {
          spider.state = 'waiting';
          spider.waitTimer = 180 + Math.random() * 240;
        }
      } else if (spider.state === 'waiting') {
        spider.waitTimer--;
        if (spider.waitTimer <= 0) {
          spider.state = 'ascending';
          spider.targetY = 30 + Math.random() * 30;
        }
      } else if (spider.state === 'ascending') {
        spider.y -= 0.5;
        if (spider.y <= spider.targetY) {
          spider.state = 'descending';
          spider.targetY = 140 + Math.random() * 120;
        }
      }
    }

    function drawSpider() {
      updateSpider();

      const swing = Math.sin(spider.legPhase * 0.3) * 4;
      const currentX = spider.x + swing;

      ctx.save();
      
      // Silk Thread
      ctx.beginPath();
      ctx.moveTo(spider.x, 0);
      ctx.lineTo(currentX, spider.y);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 0.8;
      ctx.stroke();

      // Spider Body & Legs
      ctx.translate(currentX, spider.y);

      ctx.fillStyle = 'rgba(25, 28, 32, 0.95)';
      ctx.beginPath();
      ctx.ellipse(0, 6, 5, 7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, 0, 4, 0, Math.PI * 2);
      ctx.fill();

      // Glowing Eyes
      ctx.fillStyle = 'rgba(255, 200, 200, 0.8)';
      ctx.fillRect(-1.5, -2, 1, 1);
      ctx.fillRect(0.5, -2, 1, 1);

      // Legs
      ctx.strokeStyle = 'rgba(25, 28, 32, 0.95)';
      ctx.lineWidth = 1.2;

      for (let side of [-1, 1]) {
        for (let i = 0; i < 4; i++) {
          const legMove = Math.sin(spider.legPhase + i) * (spider.state === 'waiting' ? 0.8 : 3);
          const yOffset = (i * 2.5) - 2;

          ctx.beginPath();
          ctx.moveTo(side * 2, yOffset);
          ctx.quadraticCurveTo(
            side * (10 + i), 
            yOffset - 6 + legMove, 
            side * (12 + i * 1.5), 
            yOffset + 4 + legMove
          );
          ctx.stroke();
        }
      }

      ctx.restore();
    }

    // Render Loop
    function drawFogParticle(p) {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < -p.radius) p.x = canvas.width + p.radius;
      if (p.x > canvas.width + p.radius) p.x = -p.radius;

      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
      grad.addColorStop(0, `rgba(210, 220, 235, ${p.opacity})`);
      grad.addColorStop(0.5, `rgba(150, 165, 180, ${p.opacity * 0.4})`);
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawApparition(time) {
      if (ghost.opacity <= 0.005) return;

      ghost.x += (ghost.targetX - ghost.x) * 0.008;
      ghost.y += (ghost.targetY - ghost.y) * 0.008;
      ghost.opacity += (ghost.targetOpacity - ghost.opacity) * 0.018;
      ghost.jawOpen += (ghost.targetJawOpen - ghost.jawOpen) * 0.04;

      if (ghost.state === 'fadingIn' && Math.abs(ghost.opacity - ghost.targetOpacity) < 0.05) {
        ghost.state = 'active';
      }
      if (ghost.state === 'fadingOut' && ghost.opacity < 0.01) {
        ghost.state = 'dormant';
      }

      ctx.save();
      ctx.translate(ghost.x, ghost.y);

      const radius = 210;
      const faceGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, radius);
      const baseAlpha = ghost.opacity;
      
      faceGrad.addColorStop(0, `rgba(235, 240, 245, ${baseAlpha * 0.85})`);
      faceGrad.addColorStop(0.35, `rgba(170, 180, 195, ${baseAlpha * 0.45})`);
      faceGrad.addColorStop(0.7, `rgba(90, 100, 115, ${baseAlpha * 0.15})`);
      faceGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = faceGrad;
      ctx.beginPath();
      for (let angle = 0; angle < Math.PI * 2; angle += 0.12) {
        const distortion = Math.sin(angle * 4 + time * 0.002) * 16;
        const r = radius + distortion;
        const lx = Math.cos(angle) * r;
        const ly = Math.sin(angle) * r;
        if (angle === 0) ctx.moveTo(lx, ly);
        else ctx.lineTo(lx, ly);
      }
      ctx.closePath();
      ctx.fill();

      // Dark Hollow Voids
      ctx.fillStyle = `rgba(5, 7, 10, ${baseAlpha * 0.98})`;

      const eyeOffset = 50;
      const eyeSizeY = 34;
      const eyeSizeX = 24;

      ctx.beginPath();
      ctx.ellipse(-eyeOffset, -28, eyeSizeX, eyeSizeY, 0.1, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(eyeOffset, -28, eyeSizeX, eyeSizeY, -0.1, 0, Math.PI * 2);
      ctx.fill();

      const mouthY = 55 + (ghost.jawOpen * 18);
      const mouthWidth = 34;
      const mouthHeight = 55 + (ghost.jawOpen * 52);

      ctx.beginPath();
      ctx.ellipse(0, mouthY, mouthWidth, mouthHeight, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function loop(time) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Fog
      for (let i = 0; i < fogParticles.length; i++) {
        drawFogParticle(fogParticles[i]);
      }

      // 2. Spider
      drawSpider();

      // 3. Mini Apparitions
      drawMiniGhosts();

      // 4. Bats
      animateBats();

      // 5. Screaming Ghost
      drawApparition(time);

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
