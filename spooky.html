<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PRISM Alpha Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      /* Force transparency across mobile renderers (iOS WebKit & Android WebView) */
      background: transparent !important;
      background-color: rgba(0, 0, 0, 0) !important;
      -webkit-tap-highlight-color: transparent;
    }

    #overlay-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: transparent !important;
      background-color: rgba(0, 0, 0, 0) !important;
    }

    #prism-webm-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover; /* Spans full screen; switch to 'contain' if aspect ratio distortion occurs */
      pointer-events: none;
      background: transparent !important;
      background-color: rgba(0, 0, 0, 0) !important;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div id="overlay-wrapper">
    <video 
      id="prism-webm-video" 
      src="https://www.dropbox.com/scl/fi/gbndcv61sn0xju763u16l/0825-2.webm?rlkey=ephed5kdl4o9uqinjooxj0a8f&st=8ho3sifw&raw=1" 
      autoplay 
      loop 
      muted 
      playsinline 
      webkit-playsinline>
    </video>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const video = document.getElementById('prism-webm-video');

      // Guarantee video playback on mobile WebView initialization
      const startVideo = () => {
        if (video) {
          video.muted = true; // Required by iOS & Android webview policy
          video.play().catch(err => {
            console.log('Autoplay deferred, retrying play loop:', err);
          });
        }
      };

      startVideo();

      // Ensure video resumes when PRISM comes back to foreground or scene refreshes
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          startVideo();
        }
      });

      window.addEventListener('touchstart', startVideo, { once: true });
      window.addEventListener('click', startVideo, { once: true });
    });
  </script>
</body>
</html>
