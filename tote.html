<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papa Gigs Tote Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: rgba(15, 23, 42, 0.90);
      --accent-color: #00ff88;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
      --danger-color: #ff4444;
      --door-dash: #ff3008;
      --uber-eats: #06c167;
      --amazon-flex: #ff9900;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: transparent;
      font-family: 'Inter', sans-serif;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Container with Rotating Conic Glow */
    .tote-container {
      position: relative;
      width: 480px;
      background: var(--bg-color);
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.3);
      backdrop-filter: blur(8px);
      overflow: hidden;
    }

    /* Moving Border Gradient Layer */
    .tote-container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        transparent, 
        rgba(0, 255, 136, 0.1), 
        var(--accent-color), 
        rgba(0, 255, 136, 0.1), 
        transparent 60%
      );
      animation: rotate-border 4s linear infinite;
      z-index: 0;
    }

    /* Inner Background Mask */
    .tote-container::after {
      content: '';
      position: absolute;
      inset: 2px;
      background: var(--bg-color);
      border-radius: 10px;
      z-index: 1;
    }

    @keyframes rotate-border {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Bring Content Above Mask */
    .tote-header,
    .hero-section,
    .stats-grid,
    .apps-breakdown,
    .tote-footer {
      position: relative;
      z-index: 2;
    }

    /* Header & Logo */
    .tote-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      height: 42px;
      width: auto;
      object-fit: contain;
      border-radius: 6px;
    }

    .brand-titles {
      display: flex;
      flex-direction: column;
    }

    .channel-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-main);
      line-height: 1.1;
    }

    .motto-text {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-color);
      letter-spacing: 1px;
      background: rgba(0, 255, 136, 0.08);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(0, 255, 136, 0.2);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-color);
      box-shadow: 0 0 10px var(--accent-color);
      animation: pulse-green 1.5s infinite;
    }

    @keyframes pulse-green {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); }
      70% { transform: scale(1.15); box-shadow: 0 0 0 8px rgba(0, 255, 136, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
    }

    /* Hero Total Panel */
    .hero-section {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--accent-color);
      padding: 12px 16px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 12px;
    }

    .hero-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .hero-value {
      font-size: 40px;
      font-weight: 900;
      color: var(--accent-color);
      line-height: 1;
      text-shadow: 0 0 12px rgba(0, 255, 136, 0.2);
    }

    .sub-breakdown {
      display: flex;
      justify-content: space-around;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
      font-size: 12px;
      color: var(--text-muted);
    }

    .sub-breakdown span strong {
      color: var(--text-main);
    }

    /* Stats Grid */
    .stats-grid {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat-box {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid var(--border-color);
    }

    .stat-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
    }

    /* Platform Breakdown */
    .apps-breakdown {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }

    .apps-header {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .apps-grid {
      display: flex;
      gap: 8px;
    }

    .app-card {
      flex: 1;
      background: rgba(255, 255, 255, 0.03);
      padding: 6px;
      border-radius: 6px;
      text-align: center;
      border-left: 3px solid var(--border-color);
    }

    .app-card.dd { border-left-color: var(--door-dash); }
    .app-card.ue { border-left-color: var(--uber-eats); }
    .app-card.af { border-left-color: var(--amazon-flex); }

    .app-name {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      display: block;
    }

    .app-val {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      margin-top: 2px;
      display: block;
    }

    /* Footer */
    .tote-footer {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="tote-container">
    <!-- Header with logo.jpg -->
    <div class="tote-header">
      <div class="brand-left">
        <img src="logo.jpg" alt="Papa Gigs Logo" class="brand-logo" onerror="this.style.display='none'">
        <div class="brand-titles">
          <span class="channel-title" id="streamer-name">PAPA GIGS</span>
          <span class="motto-text" id="channel-motto">WE'RE ROLLIN'</span>
        </div>
      </div>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span>TOTE BOARD</span>
      </div>
    </div>

    <!-- Main Shift Earnings -->
    <div class="hero-section">
      <div class="hero-label">Shift Earnings Total</div>
      <div class="hero-value" id="gross-earnings">$0.00</div>
      <div class="sub-breakdown">
        <span>Base: <strong id="base-pay">$0.00</strong></span>
        <span>Tips: <strong id="tips-pay" style="color: var(--accent-color);">$0.00</strong></span>
        <span>Deliveries: <strong id="delivery-count">0</strong></span>
      </div>
    </div>

    <!-- Metrics Grid -->
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">$/HOUR</div>
        <div class="stat-value" id="per-hour">$0.00</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">$/MILE</div>
        <div class="stat-value" id="per-mile">$0.00</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">MILES</div>
        <div class="stat-value" id="total-miles">0.0</div>
      </div>
    </div>

    <!-- Platform Breakdown -->
    <div class="apps-breakdown">
      <div class="apps-header">
        <span>Platform Split</span>
        <span id="active-hours">0.0 HRS</span>
      </div>
      <div class="apps-grid">
        <div class="app-card dd">
          <span class="app-name">DoorDash</span>
          <span class="app-val" id="app-dd">$0.00</span>
        </div>
        <div class="app-card ue">
          <span class="app-name">Uber Eats</span>
          <span class="app-val" id="app-ue">$0.00</span>
        </div>
        <div class="app-card af">
          <span class="app-name">Amazon Flex</span>
          <span class="app-val" id="app-af">$0.00</span>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="tote-footer">
      <span>UPDATED: <span id="last-updated">--:--</span></span>
      <span>PAPA GIGS TELEMETRY</span>
    </div>
  </div>

  <script>
    // Set your Dropbox Direct Link here (ending with dl=1)
    const DROPBOX_JSON_URL = 'https://www.dropbox.com/scl/fi/YOUR_FILE_ID/tote.json?rlkey=YOUR_KEY&dl=1';

    async function fetchToteData() {
      try {
        const response = await fetch(DROPBOX_JSON_URL + '&t=' + new Date().getTime());
        if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
        const data = await response.json();
        updateUI(data);
      } catch (error) {
        console.error("Error fetching tote.json:", error);
      }
    }

    function updateUI(data) {
      if (!data) return;

      if (data.streamer) document.getElementById('streamer-name').textContent = data.streamer;
      if (data.motto) document.getElementById('channel-motto').textContent = data.motto;

      const shift = data.shiftTotals || {};
      document.getElementById('gross-earnings').textContent = formatCurrency(shift.grossEarnings);
      document.getElementById('base-pay').textContent = formatCurrency(shift.basePay);
      document.getElementById('tips-pay').textContent = formatCurrency(shift.tips);
      document.getElementById('delivery-count').textContent = shift.deliveriesCompleted || 0;

      const eff = shift.efficiency || {};
      document.getElementById('per-hour').textContent = formatCurrency(eff.perHour);
      document.getElementById('per-mile').textContent = formatCurrency(eff.perMile);
      document.getElementById('total-miles').textContent = (shift.totalMiles || 0).toFixed(1);
      document.getElementById('active-hours').textContent = `${(shift.activeHours || 0).toFixed(1)} HRS`;

      const apps = data.appsBreakdown || {};
      document.getElementById('app-dd').textContent = formatCurrency(apps.doorDash);
      document.getElementById('app-ue').textContent = formatCurrency(apps.uberEats);
      document.getElementById('app-af').textContent = formatCurrency(apps.amazonFlex);

      if (data.lastUpdated) {
        const dateObj = new Date(data.lastUpdated);
        document.getElementById('last-updated').textContent = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
    }

    function formatCurrency(val) {
      const num = parseFloat(val) || 0;
      return '$' + num.toFixed(2);
    }

    fetchToteData();
    setInterval(fetchToteData, 10000);
  </script>
</body>
</html>
