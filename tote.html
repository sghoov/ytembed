<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papa Gigs Earnings Summary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: rgba(15, 23, 42, 0.92);
      --border-light: rgba(255, 255, 255, 0.1);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --accent-color: #00ff88;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: transparent;
      font-family: 'Inter', sans-serif;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Container with Moving Edge Glow */
    .summary-card {
      position: relative;
      width: 440px;
      background: var(--bg-color);
      border: 2px solid transparent;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.25);
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    /* Conic Gradient Layer for Edge Glow */
    .summary-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        transparent, 
        rgba(0, 255, 136, 0.1), 
        var(--accent-color), 
        rgba(0, 255, 136, 0.1), 
        transparent 60%
      );
      animation: rotate-border 4s linear infinite;
      z-index: 0;
    }

    /* Inner Dark Mask */
    .summary-card::after {
      content: '';
      position: absolute;
      inset: 2px;
      background: var(--bg-color);
      border-radius: 14px;
      z-index: 1;
    }

    @keyframes rotate-border {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Raise Content Above Background Mask */
    .header, .hero-section, .stats-grid, .apps-list {
      position: relative;
      z-index: 2;
    }

    /* Header & Enlarged Logo */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      height: 56px;
      width: 56px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .title-area {
      display: flex;
      flex-direction: column;
    }

    .title-main {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .motto-text {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-color);
      background: rgba(0, 255, 136, 0.1);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(0, 255, 136, 0.2);
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background: var(--accent-color);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-color);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* Slightly Reduced Hero Earnings Section */
    .hero-section {
      text-align: center;
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-light);
    }

    .hero-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    .hero-value {
      font-size: 42px;
      font-weight: 800;
      color: var(--accent-color);
      letter-spacing: -1px;
      line-height: 1;
    }

    /* Quick Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }

    .stat-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 16px;
      font-weight: 700;
    }

    /* Enlarged App Breakdown Rows */
    .apps-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .app-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 14px 18px;
    }

    .app-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .app-logo {
      height: 32px;
      width: 32px;
      object-fit: contain;
    }

    .app-name {
      font-size: 15px;
      font-weight: 700;
      color: #f3f4f6;
    }

    .app-amount {
      font-size: 18px;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <div class="summary-card">
    <!-- Header -->
    <div class="header">
      <div class="brand">
        <img src="logo.jpg" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
        <div class="title-area">
          <span class="title-main" id="streamer-name">PAPA GIGS</span>
          <span class="motto-text" id="channel-motto">WE'RE ROLLIN'</span>
        </div>
      </div>
      <div class="live-indicator">
        <div class="pulse-dot"></div>
        <span id="last-updated">LIVE</span>
      </div>
    </div>

    <!-- Reduced Total Earnings -->
    <div class="hero-section">
      <div class="hero-label">Shift Earnings</div>
      <div class="hero-value" id="gross-earnings">$0.00</div>
    </div>

    <!-- Quick Stats -->
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">$/HOUR</div>
        <div class="stat-value" id="per-hour">$0.00</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">$/MILE</div>
        <div class="stat-value" id="per-mile">$0.00</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">MILES</div>
        <div class="stat-value" id="total-miles">0.0</div>
      </div>
    </div>

    <!-- Enlarged Apps Breakdown -->
    <div class="apps-list">
      <!-- DoorDash -->
      <div class="app-row">
        <div class="app-info">
          <img src="https://www.dropbox.com/scl/fi/qqoansmx8y0iq6t9jmsho/dd-logo.png?rlkey=tv5yfn4i8844uhwrhy7mcntrx&st=vg5bd32h&raw=1" alt="DoorDash" class="app-logo">
          <span class="app-name">DoorDash</span>
        </div>
        <div class="app-amount" id="app-dd">$0.00</div>
      </div>

      <!-- Uber Eats -->
      <div class="app-row">
        <div class="app-info">
          <img src="https://www.dropbox.com/scl/fi/pz9u95lu4yblbcvhurt8g/uber-eats-logo.png?rlkey=euda6oskb5ddsuc2tt4jwls2p&st=gdpfdvmr&raw=1" alt="Uber Eats" class="app-logo">
          <span class="app-name">Uber Eats</span>
        </div>
        <div class="app-amount" id="app-ue">$0.00</div>
      </div>

      <!-- Amazon Flex -->
      <div class="app-row">
        <div class="app-info">
          <img src="https://www.dropbox.com/scl/fi/78v8w88f7dn57opphgcx1/flex-logo1.png?rlkey=i5fky0mtxxj860l4bnj4g4g4u&st=0u54ixn7&raw=1" alt="Amazon Flex" class="app-logo">
          <span class="app-name">Amazon Flex</span>
        </div>
        <div class="app-amount" id="app-af">$0.00</div>
      </div>
    </div>
  </div>

  <script>
    const DROPBOX_JSON_URL = 'https://www.dropbox.com/scl/fi/71ehr6zkwms82ntq3y5bh/tote.json?rlkey=c9q7jm8utds64efvj70u9tgbm&st=dmju96kf&raw=1';

    async function fetchToteData() {
      try {
        const response = await fetch(DROPBOX_JSON_URL + '&t=' + new Date().getTime());
        if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
        const data = await response.json();
        updateUI(data);
      } catch (error) {
        console.error("Error fetching tote.json:", error);
      }
    }

    function updateUI(data) {
      if (!data) return;

      if (data.streamer) document.getElementById('streamer-name').textContent = data.streamer;
      if (data.motto) document.getElementById('channel-motto').textContent = data.motto;

      const shift = data.shiftTotals || {};
      document.getElementById('gross-earnings').textContent = formatCurrency(shift.grossEarnings);

      const eff = shift.efficiency || {};
      document.getElementById('per-hour').textContent = formatCurrency(eff.perHour);
      document.getElementById('per-mile').textContent = formatCurrency(eff.perMile);
      document.getElementById('total-miles').textContent = (shift.totalMiles || 0).toFixed(1);

      const apps = data.appsBreakdown || {};
      document.getElementById('app-dd').textContent = formatCurrency(apps.doorDash);
      document.getElementById('app-ue').textContent = formatCurrency(apps.uberEats);
      document.getElementById('app-af').textContent = formatCurrency(apps.amazonFlex);
      
      if (data.lastUpdated) {
        const dateObj = new Date(data.lastUpdated);
        document.getElementById('last-updated').textContent = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
    }

    function formatCurrency(val) {
      const num = parseFloat(val) || 0;
      return '$' + num.toFixed(2);
    }

    fetchToteData();
    setInterval(fetchToteData, 10000);
  </script>
</body>
</html>
