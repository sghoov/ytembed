<script>
    const RAW_DROPBOX_URL = 'https://www.dropbox.com/scl/fi/71ehr6zkwms82ntq3y5bh/tote.json?rlkey=c9q7jm8utds64efvj70u9tgbm&st=i2b1or5c&raw=1';

    async function fetchToteData() {
      const timestampedUrl = RAW_DROPBOX_URL + '&t=' + Date.now();
      const primaryProxy = 'https://corsproxy.io/?' + encodeURIComponent(timestampedUrl);
      const backupProxy = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(timestampedUrl);

      let data = null;

      try {
        const response = await fetch(primaryProxy);
        if (!response.ok) throw new Error(`Primary proxy HTTP ${response.status}`);
        data = await response.json();
      } catch (err) {
        try {
          const backupResponse = await fetch(backupProxy);
          if (!backupResponse.ok) throw new Error(`Backup proxy HTTP ${backupResponse.status}`);
          data = await backupResponse.json();
        } catch (backupErr) {
          console.error("Both CORS proxies failed:", backupErr);
          return;
        }
      }

      updateUI(data);
    }

    function updateUI(data) {
      if (!data) return;

      if (data.streamer) document.getElementById('streamer-name').textContent = data.streamer;
      if (data.motto) document.getElementById('channel-motto').textContent = data.motto;

      const shift = data.shiftTotals || {};
      const apps = data.appsBreakdown || {};

      const ddAmt = parseFloat(apps.doorDash) || 0;
      const ueAmt = parseFloat(apps.uberEats) || 0;
      const afAmt = parseFloat(apps.amazonFlex) || 0;

      // Sum the 3 app subtotals
      const sumApps = ddAmt + ueAmt + afAmt;
      const gross = sumApps > 0 ? sumApps : (parseFloat(shift.grossEarnings) || 0);

      const actualMiles = parseFloat(shift.actualMiles) || 0;
      const offerMiles = parseFloat(shift.offerMiles) || parseFloat(shift.totalMiles) || 0;
      const activeHours = parseFloat(shift.activeHours) || 0;

      const milesUsed = actualMiles > 0 ? actualMiles : offerMiles;

      const perHour = activeHours > 0 ? (gross / activeHours) : 0;
      const perMile = milesUsed > 0 ? (gross / milesUsed) : 0;

      // Render Shift Earnings & Metrics
      document.getElementById('gross-earnings').textContent = formatCurrency(gross);
      document.getElementById('per-hour').textContent = formatCurrency(perHour);
      document.getElementById('per-mile').textContent = formatCurrency(perMile);
      document.getElementById('total-miles').textContent = milesUsed.toFixed(1);

      // Render App Subtotals & Bar Fills
      document.getElementById('app-dd').textContent = formatCurrency(ddAmt);
      document.getElementById('app-ue').textContent = formatCurrency(ueAmt);
      document.getElementById('app-af').textContent = formatCurrency(afAmt);

      const maxAmt = Math.max(ddAmt, ueAmt, afAmt, 1);
      document.getElementById('bar-dd').style.width = `${(ddAmt / maxAmt) * 100}%`;
      document.getElementById('bar-ue').style.width = `${(ueAmt / maxAmt) * 100}%`;
      document.getElementById('bar-af').style.width = `${(afAmt / maxAmt) * 100}%`;
    }

    function formatCurrency(val) {
      const num = parseFloat(val) || 0;
      return '$' + num.toFixed(2);
    }

    fetchToteData();
    setInterval(fetchToteData, 10000);
  </script>
